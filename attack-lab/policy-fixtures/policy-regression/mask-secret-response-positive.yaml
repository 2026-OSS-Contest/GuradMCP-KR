id: mask_secret_response_positive
description: A credential in a tool response is masked before delivery.
coverage:
  policy_id: mask_secret_response
  expectation: match
event:
  direction: response
  tool: read_file
  # Trusted on purpose: a server being trusted says nothing about whether the
  # payload it returned contains a key.
  server_trust: trusted
  detections: [SECRET.GITHUB_TOKEN]
  risk_score: 60
expected:
  action: mask_then_allow
  matched_policy_ids: [mask_secret_response]
