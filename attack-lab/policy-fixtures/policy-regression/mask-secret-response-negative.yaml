id: mask_secret_response_negative
description: A credential in a request is not this policy's business.
coverage:
  policy_id: mask_secret_response
  expectation: not_match
event:
  # The direction is what keeps these apart. Masking a credential the Agent is
  # sending would hide the exfiltration rather than gate it; that call belongs to
  # approve_external_email_with_secret, which requires approval instead.
  direction: request
  tool: read_file
  server_trust: trusted
  detections: [SECRET.GITHUB_TOKEN]
  risk_score: 60
expected:
  action: allow
  matched_policy_ids: []
