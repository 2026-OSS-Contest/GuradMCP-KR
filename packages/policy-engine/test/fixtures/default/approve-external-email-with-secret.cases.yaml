# 부록 A 예시 정책 2/2.
policyId: approve_external_email_with_secret
policyFile: ../../../../../policy-packs/default/policies/require-approval-external-secret-email.yaml
pack: default
cases:
  - name: "사내 도메인 밖으로 SECRET을 포함한 메일 발송은 승인이 필요하다"
    input:
      direction: request
      tool: send_email
      serverTrust: trusted
      args:
        to: "partner@external-example.com"
      detections:
        - type: SECRET
      riskScore: 80
    expected:
      verdict: require_approval
      matchedPolicyIds: [approve_external_email_with_secret]
      severity: high

  - name: "PII.RRN_LIKE 탐지로도 동일하게 승인이 필요하다"
    input:
      direction: request
      tool: send_email
      serverTrust: untrusted
      args:
        to: "partner@external-example.com"
      detections:
        - type: PII
          subtype: RRN_LIKE
      riskScore: 75
    expected:
      verdict: require_approval
      matchedPolicyIds: [approve_external_email_with_secret]
      severity: high

  - name: "사내 도메인으로 보내는 메일은 통과한다 (음성 케이스)"
    input:
      direction: request
      tool: send_email
      serverTrust: trusted
      args:
        to: "colleague@company.co.kr"
      detections:
        - type: SECRET
      riskScore: 80
    expected:
      verdict: allow
      matchedPolicyIds: []

  - name: "민감 탐지가 없으면 통과한다 (음성 케이스)"
    input:
      direction: request
      tool: send_email
      serverTrust: trusted
      args:
        to: "partner@external-example.com"
      detections: []
      riskScore: 80
    expected:
      verdict: allow
      matchedPolicyIds: []

  - name: "risk_score가 임계치 미만이면 통과한다 (음성 케이스)"
    input:
      direction: request
      tool: send_email
      serverTrust: trusted
      args:
        to: "partner@external-example.com"
      detections:
        - type: SECRET
      riskScore: 50
    expected:
      verdict: allow
      matchedPolicyIds: []
