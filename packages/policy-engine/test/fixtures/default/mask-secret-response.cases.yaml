policyId: mask_secret_response
policyFile: ../../../../../policy-packs/default/policies/mask-secret-response.yaml
pack: default
cases:
  - name: "도구 응답에서 SECRET이 탐지되면 마스킹 후 통과시킨다"
    input:
      direction: response
      tool: fetch_data
      serverTrust: trusted
      args: {}
      detections:
        - type: SECRET
      riskScore: 20
    expected:
      verdict: mask_then_allow
      matchedPolicyIds: [mask_secret_response]
      severity: high

  - name: "trust 등급과 무관하게 매칭된다 (untrusted 서버도 동일)"
    input:
      direction: response
      tool: fetch_data
      serverTrust: untrusted
      args: {}
      detections:
        - type: SECRET
      riskScore: 0
    expected:
      verdict: mask_then_allow
      matchedPolicyIds: [mask_secret_response]
      severity: high

  - name: "SECRET 탐지가 없으면 통과한다 (음성 케이스)"
    input:
      direction: response
      tool: fetch_data
      serverTrust: trusted
      args: {}
      detections: []
      riskScore: 0
    expected:
      verdict: allow
      matchedPolicyIds: []
