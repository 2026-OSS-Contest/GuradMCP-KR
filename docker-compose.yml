name: ${COMPOSE_PROJECT_NAME:-guardmcp-kr}

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - guardmcp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777

x-node-healthcheck: &node-healthcheck
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 5s

x-demo-agent: &demo-agent
  <<: *service-defaults
  build:
    context: .
    dockerfile: apps/demo-agent/Dockerfile
    args:
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
  image: ${GUARDMCP_REGISTRY:-ghcr.io/2026-oss-contest}/guardmcp-demo-agent:${GUARDMCP_IMAGE_TAG:-local}
  environment:
    PORT: "3002"
    SERVICE_NAME: demo-agent
    GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    GATEWAY_URL: http://gateway:3001
    DEMO_MCP_TOOLS_URL: http://demo-mcp-tools:3003
    DEPENDENCY_URLS: http://gateway:3001/health,http://demo-mcp-tools:3003/health
  healthcheck:
    <<: *node-healthcheck
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]

x-demo-mcp-tools: &demo-mcp-tools
  <<: *service-defaults
  build:
    context: .
    dockerfile: apps/demo-mcp-tools/Dockerfile
    args:
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
  image: ${GUARDMCP_REGISTRY:-ghcr.io/2026-oss-contest}/guardmcp-demo-mcp-tools:${GUARDMCP_IMAGE_TAG:-local}
  environment:
    PORT: "3003"
    SERVICE_NAME: demo-mcp-tools
    GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    DEMO_SEED_ID: guardmcp-demo-v1
    # /tmp is the only writable path under read_only:true (tmpfs, see service-defaults above).
    DEMO_OUTBOX_DIR: /tmp/outbox
  healthcheck:
    <<: *node-healthcheck
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardmcp}
      POSTGRES_USER: ${POSTGRES_USER:-guardmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardmcp-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - guardmcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  postgres-seed:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-guardmcp}
      PGUSER: ${POSTGRES_USER:-guardmcp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-guardmcp-local-only}
    command: ["psql", "--set", "ON_ERROR_STOP=1", "--file", "/seed/001-demo-seed.sql", "--file", "/seed/002-mcp-servers.sql"]
    volumes:
      - ./infra/postgres/001-demo-seed.sql:/seed/001-demo-seed.sql:ro
      - ./infra/postgres/002-mcp-servers.sql:/seed/002-mcp-servers.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - guardmcp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-guardmcp-local-only}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - guardmcp
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  redis-seed:
    image: redis:7-alpine
    restart: "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-guardmcp-local-only}
    entrypoint: ["sh", "/seed/001-demo-seed.sh"]
    volumes:
      - ./infra/redis/001-demo-seed.sh:/seed/001-demo-seed.sh:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - guardmcp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
      args:
        GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    image: ${GUARDMCP_REGISTRY:-ghcr.io/2026-oss-contest}/guardmcp-gateway:${GUARDMCP_IMAGE_TAG:-local}
    environment:
      PORT: "3001"
      SERVICE_NAME: gateway
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardmcp}:${POSTGRES_PASSWORD:-guardmcp-local-only}@postgres:5432/${POSTGRES_DB:-guardmcp}
      REDIS_URL: redis://:${REDIS_PASSWORD:-guardmcp-local-only}@redis:6379/0
      CONTROL_PLANE_URL: http://control-plane:8080
      # Same shared secret the control-plane service reads below as POLICY_SYNC_TOKEN — sent as
      # X-Sync-Token on every POST /policies/sync (fix-api.md §1 review: that endpoint must not
      # accept an unauthenticated registry overwrite). Defaulted, not blank, like
      # POSTGRES_PASSWORD/REDIS_PASSWORD: unlike reveal, sync isn't optional to the demo stack —
      # PolicyStore never receives a registry without it.
      POLICY_SYNC_TOKEN: ${POLICY_SYNC_TOKEN:-guardmcp-local-only}
      DEMO_MCP_TOOLS_URL: http://demo-mcp-tools:3003
      # Identity of the single upstream this gateway routes to, in the Control Plane's server
      # registry (FR-GW-02 §4.1) — must match a seeded id in infra/postgres/002-mcp-servers.sql.
      GATEWAY_SERVER_ID: 30000000-0000-4000-8000-000000000001
      DEPENDENCY_TCP: postgres:5432,redis:6379
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3001}:3001"
    volumes:
      # FR-POL-03: bind-mounted (not baked into the image) so an edit under the host's
      # policy-packs/ is hot-reloaded into the running container without a rebuild. `:ro` is
      # enough — the gateway only watches/reads this path, it never writes to it.
      - ./policy-packs:/app/policy-packs:ro
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      redis-seed:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]

  control-plane:
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/control-plane/Dockerfile
      args:
        GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    image: ${GUARDMCP_REGISTRY:-ghcr.io/2026-oss-contest}/guardmcp-control-plane:${GUARDMCP_IMAGE_TAG:-local}
    environment:
      PORT: "8080"
      SERVER_PORT: "8080"
      SERVICE_NAME: control-plane
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      SPRING_PROFILES_ACTIVE: compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardmcp}:${POSTGRES_PASSWORD:-guardmcp-local-only}@postgres:5432/${POSTGRES_DB:-guardmcp}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-guardmcp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-guardmcp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-guardmcp-local-only}
      REDIS_URL: redis://:${REDIS_PASSWORD:-guardmcp-local-only}@redis:6379/0
      DEPENDENCY_TCP: postgres:5432,redis:6379
      # NFR-04: unset (empty) by default, same as every other demo/development secret in this
      # file — POST /events/{id}/reveal stays disabled until an operator sets this explicitly.
      REVEAL_OPERATOR_TOKEN: ${REVEAL_OPERATOR_TOKEN:-}
      # Defaulted (not blank) — see the same variable on the gateway service above.
      POLICY_SYNC_TOKEN: ${POLICY_SYNC_TOKEN:-guardmcp-local-only}
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-8080}:8080"
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      redis-seed:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]

  console:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    image: ${GUARDMCP_REGISTRY:-ghcr.io/2026-oss-contest}/guardmcp-console:${GUARDMCP_IMAGE_TAG:-local}
    environment:
      PORT: "3000"
      SERVICE_NAME: console
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      NODE_ENV: production
      GATEWAY_URL: http://gateway:3001
      CONTROL_PLANE_URL: http://control-plane:8080
      # fix-api.md §6 (option 2): same shared secret the control-plane service reads below as
      # REVEAL_OPERATOR_TOKEN — the console's server-side reveal proxy
      # (app/api/v1/events/[eventId]/reveal/route.ts) attaches it as X-Operator-Token. Never
      # NEXT_PUBLIC_*, so it stays out of the client bundle and the browser never sees it.
      OPERATOR_TOKEN: ${REVEAL_OPERATOR_TOKEN:-}
      DEPENDENCY_URLS: http://gateway:3001/health,http://control-plane:8080/actuator/health
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]

  # Demo mode: immutable images and deterministic scenarios.
  demo-mcp-tools:
    <<: *demo-mcp-tools
    profiles: ["demo"]
    environment:
      PORT: "3003"
      SERVICE_NAME: demo-mcp-tools
      APP_MODE: demo
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      DEMO_SEED_ID: guardmcp-demo-v1
      DEMO_OUTBOX_DIR: /tmp/outbox
    ports:
      - "127.0.0.1:${DEMO_MCP_TOOLS_PORT:-3003}:3003"

  demo-agent:
    <<: *demo-agent
    profiles: ["demo"]
    environment:
      PORT: "3002"
      SERVICE_NAME: demo-agent
      APP_MODE: demo
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      GATEWAY_URL: http://gateway:3001
      DEMO_MCP_TOOLS_URL: http://demo-mcp-tools:3003
      DEPENDENCY_URLS: http://gateway:3001/health,http://demo-mcp-tools:3003/health
    ports:
      - "127.0.0.1:${DEMO_AGENT_PORT:-3002}:3002"
    depends_on:
      gateway:
        condition: service_healthy
      demo-mcp-tools:
        condition: service_healthy

  # Development mode is deliberately a separate, mutually-exclusive profile.
  # It has the same stable host ports while exposing APP_MODE=development.
  demo-mcp-tools-dev:
    <<: *demo-mcp-tools
    profiles: ["dev"]
    build:
      context: .
      dockerfile: apps/demo-mcp-tools/Dockerfile
      target: development
      args:
        GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    environment:
      PORT: "3003"
      SERVICE_NAME: demo-mcp-tools
      APP_MODE: development
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      DEMO_SEED_ID: guardmcp-demo-v1
      DEMO_OUTBOX_DIR: /tmp/outbox
    ports:
      - "127.0.0.1:${DEMO_MCP_TOOLS_PORT:-3003}:3003"
    volumes:
      - ./apps/demo-mcp-tools/src:/workspace/apps/demo-mcp-tools/src:ro
    networks:
      guardmcp:
        aliases:
          - demo-mcp-tools

  # Unlike demo-mcp-tools-dev, this compiled JVM agent has no source-watch dev mode:
  # it reuses the immutable runtime image. Source changes require an image rebuild.
  demo-agent-dev:
    <<: *demo-agent
    profiles: ["dev"]
    build:
      context: .
      dockerfile: apps/demo-agent/Dockerfile
      target: development
      args:
        GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
    environment:
      PORT: "3002"
      SERVICE_NAME: demo-agent
      APP_MODE: development
      GUARDMCP_VERSION: ${GUARDMCP_VERSION:-dev}
      GATEWAY_URL: http://gateway:3001
      DEMO_MCP_TOOLS_URL: http://demo-mcp-tools:3003
      DEPENDENCY_URLS: http://gateway:3001/health,http://demo-mcp-tools:3003/health
    ports:
      - "127.0.0.1:${DEMO_AGENT_PORT:-3002}:3002"
    depends_on:
      gateway:
        condition: service_healthy
      demo-mcp-tools-dev:
        condition: service_healthy
    networks:
      guardmcp:
        aliases:
          - demo-agent

networks:
  guardmcp:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
