openapi: 3.1.0
info:
  title: GuardMCP Control Plane Public API
  version: 1.0.0
  description: >-
    Public API v1 served by services/control-plane for the GuardMCP console.
    Most identifiers and demo data mirror the deterministic seeds in
    infra/postgres/001-demo-seed.sql and infra/redis/001-demo-seed.sh; the
    Replay-only fixtures used to exercise hash-chain and pagination behavior
    (see DemoSeed.SESSION_BROKEN_CHAIN_ID / SESSION_LARGE_ID) are in-memory
    only and intentionally absent from those seed files.
servers:
  - url: http://localhost:8080
    description: Local development (docker compose exposes the same port)
tags:
  - name: overview
  - name: sessions
  - name: policies
  - name: approvals
  - name: detect
  - name: attack-lab
  - name: servers
  - name: settings
paths:
  /api/v1/overview:
    get:
      tags: [overview]
      summary: Protection status summary
      operationId: getOverview
      responses:
        "200":
          description: Current protection summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions for the Replay left panel
      operationId: listSessions
      parameters:
        - name: q
          in: query
          required: false
          description: Session id or toolName substring match (case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [live, closed]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Sessions ordered by startedAt descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}/timeline:
    get:
      tags: [sessions]
      summary: Replay timeline for one session
      description: >-
        Returns the session's timeline nodes (USER_INPUT, AGENT_STEP, TOOL_CALL,
        VERDICT, RESULT) in ts-ascending order, eventId as the tie-break. Only
        VERDICT nodes carry `detail` (matched policies, detections, mask diff
        reference, hash chain). See docs/task-docs/GMCP-28/replay-api-spec.md.
      operationId: getSessionTimeline
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: event
          in: query
          required: false
          description: Anchors the response on this eventId (deep-link support)
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: ISO-8601 instant; only nodes strictly after this are returned
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
      responses:
        "200":
          description: Ordered timeline nodes for the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTimelineResponse"
        "400":
          description: The `event` query param does not name an eventId in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/export:
    post:
      tags: [sessions]
      summary: Session report export (GMCP-80 §3.7, M4 deliverable)
      description: >-
        Synchronous file-stream response (no async job endpoint yet — the
        spec's own sanctioned fallback while that scope is unconfirmed).
        Renders the session's timeline, verdict rationale and chain status
        straight from the same data GET /sessions/{id}/timeline serves, so
        the report can only ever carry masked text (NFR-04). Console
        exposure is deferred to M4; the API is available now.
      operationId: exportSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: The rendered report as an attachment
          content:
            text/html: {}
            application/pdf: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/recent:
    get:
      tags: [sessions]
      summary: Recent security events (GMCP-80 §3.3)
      description: >-
        Backs the SCR-101 "최근 보안 이벤트" widget and doubles as the SSE
        reconnect gap-fill (4.2 "복구 시 끊긴 구간은 폴링으로 보충").
        `since` accepts either an eventId (resume strictly after it) or an
        ISO-8601 instant (resume from that moment onward); results are
        newest-first. Backed by the real guard_event table (GMCP-24), not the
        Replay demo fixtures.
      operationId: listRecentEvents
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: An eventId (uuid) or an ISO-8601 instant
          schema:
            type: string
      responses:
        "200":
          description: Recent events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/events/{eventId}:
    get:
      tags: [sessions]
      summary: Single timeline node lookup (deep-link support)
      description: >-
        Same node schema as a timeline entry, with `sessionId` added, so a
        deep link (`/replay/{sessionId}?event={eventId}`) can paint the detail
        panel without loading the full timeline first.
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The timeline node, with its owning sessionId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventLookupResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{eventId}/reveal:
    post:
      tags: [sessions]
      summary: Reveal the unmasked original payload (NFR-04, GMCP-80 §3.6)
      description: >-
        Operator-only. Every call — granted or denied — writes an append-only
        RevealAuditLog entry. 409 when this event's raw payload was never
        stored (audit.store-raw-payload / settings.storeRawOptIn was off at
        ingest time), not 404. Does not match apps/console/lib/api/types.ts's
        RevealContent (masked-line reconstruction is out of scope here); this
        is the spec's own response shape.
      operationId: revealEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Actor-Role
          in: header
          required: false
          description: Must be "operator" or the call is rejected with 403.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: Unmasked payload plus the audit log entry it created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResponse"
        "403":
          description: Actor is not an operator (the attempt is still logged as REVEAL_DENIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No raw payload was stored for this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/policy-packs:
    get:
      tags: [policies]
      summary: List policy packs
      operationId: listPolicyPacks
      responses:
        "200":
          description: All policy packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyPack"
  /api/v1/policy-packs/{packId}:
    put:
      tags: [policies]
      summary: Enable or disable a policy pack
      operationId: updatePolicyPack
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated pack with a bumped version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyPack"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/policies:
    get:
      tags: [policies]
      summary: List policies in priority order
      operationId: listPolicies
      responses:
        "200":
          description: All policies sorted by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
  /api/v1/policies/{policyId}:
    put:
      tags: [policies]
      summary: Update a policy's action, severity, or priority
      operationId: updatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: "#/components/schemas/GuardAction"
                severity:
                  $ref: "#/components/schemas/Severity"
                priority:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated policy; the owning pack version is bumped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/policies/{policyId}/stats:
    get:
      tags: [policies]
      summary: Policy trigger stats (GMCP-80 §3.5)
      description: >-
        A policy with no trigger history answers firedLast30d=0, not 404 —
        only an unknown policyId is a 404. dryRun=true always answers
        firedLast30d=0: no policy in this system is ever marked dry-run yet
        (GMCP-77 is unbuilt), so there is no dry-run subset of guard_event
        to count.
      operationId: getPolicyStats
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          description: 'Duration like "30d"'
          schema:
            type: string
            default: 30d
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Trigger count and last-triggered timestamp for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: List approval cards
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Approval cards ordered by request time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [approvals]
      summary: Register a tool call held for human approval
      description: >-
        Called by the gateway when a policy verdict is require_approval. The
        approval fails closed 120 seconds after registration if no decision
        arrives.
      operationId: createApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: Pending approval card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals/{approvalId}/decision:
    post:
      tags: [approvals]
      summary: Resolve a pending approval
      operationId: decideApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  $ref: "#/components/schemas/ApprovalDecision"
                decidedBy:
                  type: string
      responses:
        "200":
          description: Approval with its terminal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The approval was already decided or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/detect/preview:
    post:
      tags: [detect]
      summary: Preview how the seeded policy pack judges a text
      description: >-
        Deterministic preview limited to the seeded policies
        (block_env_file_read, mask_korean_phone, approve_external_email).
        The full detector engine lives in packages/policy-engine; verdict
        aggregation here is fail-closed (strongest matched action wins).
      operationId: previewDetection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Findings, aggregate verdict, and masked text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/attacklab/scenarios:
    get:
      tags: [attack-lab]
      summary: Attack Lab scenario catalog (GMCP-80 §3.4)
      description: >-
        Derived from attack-lab/scenarios/catalog.json (the same file the
        GMCP-55 runner executes against) at build time, not hand-maintained —
        a threat is available only once every one of its attack-kind
        scenarios has automation.mode=probe. Scoped to PROJECT.md 3.2's
        T-01..T-08; the catalog has since grown a T-09 this endpoint does
        not cover.
      operationId: listAttackLabScenarios
      responses:
        "200":
          description: All eight threats, available/modes reflecting real automation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackScenariosResponse"
  /api/v1/attacklab/run/{scenarioId}:
    post:
      tags: [attack-lab]
      summary: Queue an attack-lab scenario run
      description: >-
        Records the run request. Execution is owned by the Attack Lab runner
        (GMCP-55); this endpoint only validates the scenario and queues it.
      operationId: runAttackLabScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            pattern: "^T-0[1-8]$"
      responses:
        "202":
          description: Queued run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackLabRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/servers:
    get:
      tags: [servers]
      summary: List registered MCP servers (FR-GW-02)
      description: >-
        Lean summary shape shared by the console home-page inventory and the
        gateway's server-registry cache sync. See /api/v1/servers/{id} for the
        full entity (endpoint, connection/tool-snapshot state, trust-change
        provenance).
      operationId: listServers
      responses:
        "200":
          description: Registered servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServersResponse"
  /api/v1/servers/{id}:
    get:
      tags: [servers]
      summary: Server detail
      operationId: getServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full server entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/servers/{id}/trust:
    put:
      tags: [servers]
      summary: Change a server's trust grade
      description: >-
        Grade order is untrusted < limited < trusted. A downgrade applies
        immediately regardless of `confirmed`. An upgrade without
        `confirmed: true` is rejected with 409 and an impact summary instead
        of applying; the same request with `confirmed: true` then applies it.
        A request for the server's current grade is a no-op. Every actual
        change is recorded as a TrustLevelChangeEvent in the audit hash chain
        and pushed to /api/v1/servers/stream subscribers immediately. This is
        the endpoint GMCP-80 §3.8.1's `PUT /servers/{id}` describes — the
        console (lib/api/client.ts) deliberately calls this trust
        sub-resource rather than a bare PUT /servers/{id}, so no separate
        endpoint was added.
      operationId: changeServerTrust
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustChangeRequest"
      responses:
        "200":
          description: Updated (or unchanged, for a no-op) server summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The requested change is an upgrade and confirmed was not true.
            details carries fromTrust, toTrust, and affectedPolicyCount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/servers/trust-events:
    get:
      tags: [servers]
      summary: Trust-change audit chain
      description: Every TrustLevelChangeEvent recorded so far, in chain order (Replay Dashboard query surface).
      operationId: listTrustChangeEvents
      responses:
        "200":
          description: Chained trust-change events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustLevelChangeEvent"
  /api/v1/servers/stream:
    get:
      tags: [servers]
      summary: Server-registry push channel
      description: >-
        Server-sent events. Emits a servers.snapshot event with the current
        ServersResponse on connect, and again after every trust change — the
        gateway's registry cache and the console both subscribe instead of
        polling, so a downgrade reaches them without waiting out a poll
        interval.
      operationId: streamServers
      responses:
        "200":
          description: text/event-stream of servers.snapshot frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ServersResponse"
  /api/v1/settings:
    get:
      tags: [settings]
      summary: Current gateway settings (GMCP-68)
      operationId: getSettings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettings"
    put:
      tags: [settings]
      summary: Update gateway settings
      description: >-
        Every field is independent, so a caller sends only what it changed.
        Setting failMode to fail_open requires riskAcknowledged: true in the
        same request, regardless of the previous value — otherwise the
        request is rejected with 400 and nothing is changed. Reverting
        failMode to fail_closed never requires it. A failMode change is
        recorded as a SETTINGS_FAILURE_POLICY_CHANGED audit-log entry
        (severity=high for fail_open, info for fail_closed) and pushed to
        /api/v1/settings/stream subscribers immediately.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettings"
        "400":
          description: >-
            Malformed failMode, or failMode=fail_open without
            riskAcknowledged=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/settings/stream:
    get:
      tags: [settings]
      summary: Settings push channel
      description: >-
        Server-sent events. Emits a settings.changed event with the current
        failMode and version on connect, and again after every failMode
        change — the gateway's failure-policy cache subscribes instead of
        polling, matching /api/v1/servers/stream's contract.
      operationId: streamSettings
      responses:
        "200":
          description: text/event-stream of settings.changed frames
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  failMode:
                    $ref: "#/components/schemas/FailMode"
                  version:
                    type: integer
                    format: int64
components:
  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The referenced resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    GuardAction:
      type: string
      enum: [allow, mask_then_allow, require_approval, block]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    ApprovalStatus:
      type: string
      enum: [pending, approved, approved_masked, blocked, expired]
    ApprovalDecision:
      type: string
      enum: [block, approve_masked, approve]
    FailMode:
      type: string
      description: >-
        What the gateway does when its own inspection pipeline errors or
        times out (NFR-03, GMCP-68). fail_closed is the shipped default.
      enum: [fail_closed, fail_open]
    GuardSettings:
      type: object
      required: [failMode, riskAcknowledged, storeRawOptIn, locale, approvalTimeoutSeconds]
      properties:
        failMode:
          $ref: "#/components/schemas/FailMode"
        riskAcknowledged:
          type: boolean
          description: >-
            Whether the operator ticked the risk-acknowledgement checkbox the
            last time failMode became fail_open.
        storeRawOptIn:
          type: boolean
        locale:
          type: string
          enum: [ko, en]
        approvalTimeoutSeconds:
          type: integer
    SettingsUpdateRequest:
      type: object
      description: Every field optional; unset fields are left unchanged.
      properties:
        failMode:
          $ref: "#/components/schemas/FailMode"
        riskAcknowledged:
          type: boolean
        storeRawOptIn:
          type: boolean
        locale:
          type: string
          enum: [ko, en]
        approvalTimeoutSeconds:
          type: integer
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason code
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
    Overview:
      type: object
      required:
        - protected
        - gatewayCount
        - activePolicyPacks
        - blockedToday
        - maskedToday
        - pendingApprovals
        - generatedAt
      properties:
        protected:
          type: boolean
        gatewayCount:
          type: integer
        activePolicyPacks:
          type: array
          items:
            type: string
        blockedToday:
          type: integer
        maskedToday:
          type: integer
        pendingApprovals:
          type: integer
        generatedAt:
          type: string
          format: date-time
    Verdict:
      type: string
      description: >-
        Replay/console display vocabulary (PROJECT.md 5.3, SCREEN-SPACE.md 4.3).
        Distinct from GuardAction: mask_then_allow there corresponds to warn
        here, so this API never emits "mask" despite an editorial slip in the
        original replay-api-spec.md task doc.
      enum: [allow, warn, require_approval, block]
    TimelineNodeType:
      type: string
      enum: [USER_INPUT, AGENT_STEP, TOOL_CALL, VERDICT, RESULT]
    ToolCallDirection:
      type: string
      enum: [req, res]
    ChainStatus:
      type: string
      enum: [valid, broken]
    Span:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
        end:
          type: integer
    Detection:
      type: object
      required: [type, subtype, span, confidence, maskedAs]
      properties:
        type:
          type: string
          description: PII | SECRET | INJ
        subtype:
          type: string
        span:
          $ref: "#/components/schemas/Span"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        maskedAs:
          type: string
          description: Always the masked form; the raw match is never returned by this API.
    VerdictDetail:
      type: object
      required: [matchedPolicyIds, detections, maskDiffRef, hash, prevHash]
      properties:
        matchedPolicyIds:
          type: array
          items:
            type: string
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        maskDiffRef:
          type: string
          description: URL the Mask Diff View fetches separately (GET /events/{id}/mask-diff, out of scope)
        hash:
          type: string
        prevHash:
          type: string
          description: Empty string for the first VERDICT node in a session (chain genesis)
    TimelineNode:
      type: object
      required: [eventId, type, ts, summary, detail]
      description: >-
        `detail` is populated only for type=VERDICT; every other node type
        returns it as an explicit null. toolName/direction/argsDigest are only
        present on TOOL_CALL nodes; verdict/riskScore only on VERDICT nodes.
      properties:
        eventId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TimelineNodeType"
        ts:
          type: string
          format: date-time
        summary:
          type: string
        toolName:
          type: string
        direction:
          $ref: "#/components/schemas/ToolCallDirection"
        argsDigest:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        detail:
          oneOf:
            - $ref: "#/components/schemas/VerdictDetail"
            - type: "null"
    SessionSummary:
      type: object
      required: [sessionId, agentLabel, startedAt, endedAt, isLive, eventCount, verdictSummary]
      properties:
        sessionId:
          type: string
          format: uuid
        agentLabel:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
        isLive:
          type: boolean
        eventCount:
          type: integer
        verdictSummary:
          type: object
          description: Fixed keys allow/warn/require_approval/block, always all four.
          additionalProperties:
            type: integer
    SessionsResponse:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        nextCursor:
          type: [string, "null"]
        total:
          type: integer
          description: Count matching q/status — not items.length, the page size (GMCP-80 §3.2).
    SessionTimelineResponse:
      type: object
      required: [sessionId, agentLabel, startedAt, isLive, chainStatus, nodes, nextCursor]
      properties:
        sessionId:
          type: string
          format: uuid
        agentLabel:
          type: string
        startedAt:
          type: string
          format: date-time
        isLive:
          type: boolean
        chainStatus:
          $ref: "#/components/schemas/ChainStatus"
        brokenAt:
          type: string
          format: uuid
          description: First eventId whose hash chain check failed; present only when chainStatus=broken
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TimelineNode"
        nextCursor:
          type: [string, "null"]
    EventLookupResponse:
      allOf:
        - type: object
          required: [sessionId]
          properties:
            sessionId:
              type: string
              format: uuid
        - $ref: "#/components/schemas/TimelineNode"
    PolicyPack:
      type: object
      required: [id, version, enabled, description, updatedAt]
      properties:
        id:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        description:
          type: string
        updatedAt:
          type: string
          format: date-time
    Policy:
      type: object
      required: [id, packId, priority, action, severity, description]
      properties:
        id:
          type: string
        packId:
          type: string
        priority:
          type: integer
        action:
          $ref: "#/components/schemas/GuardAction"
        severity:
          $ref: "#/components/schemas/Severity"
        description:
          type: string
    ApprovalCreateRequest:
      type: object
      required: [sessionId, toolName, riskReason]
      properties:
        sessionId:
          type: string
          format: uuid
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string
        riskReason:
          type: string
        policyId:
          type: [string, "null"]
    Approval:
      type: object
      required: [id, sessionId, status, toolName, arguments, riskReason, requestedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string
        riskReason:
          type: string
        policyId:
          type: [string, "null"]
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - $ref: "#/components/schemas/ApprovalDecision"
            - type: "null"
        decidedBy:
          type: [string, "null"]
        decidedAt:
          type: [string, "null"]
          format: date-time
    DetectionFinding:
      type: object
      required: [policyId, action, severity, matchedText, start, end]
      properties:
        policyId:
          type: string
        action:
          $ref: "#/components/schemas/GuardAction"
        severity:
          $ref: "#/components/schemas/Severity"
        matchedText:
          type: string
        start:
          type: integer
        end:
          type: integer
    DetectionPreview:
      type: object
      required: [verdict, findings, maskedText]
      properties:
        verdict:
          $ref: "#/components/schemas/GuardAction"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DetectionFinding"
        maskedText:
          type: string
    AttackLabRun:
      type: object
      required: [runId, scenarioId, status, requestedAt]
      properties:
        runId:
          type: string
          format: uuid
        scenarioId:
          type: string
        status:
          type: string
          enum: [queued]
        requestedAt:
          type: string
          format: date-time
    TrustLevel:
      type: string
      enum: [trusted, limited, untrusted]
    ConnectionStatus:
      type: string
      enum: [connected, disconnected]
    ToolRisk:
      type: string
      enum: [high, medium, low]
    SnapshotDiff:
      type: object
      required: [before, after]
      description: Rug Pull evidence (FR-GW-03) — the tool description at first approval vs its current one.
      properties:
        before:
          type: string
        after:
          type: string
    ToolSummary:
      type: object
      required: [name, risk, policies, snapshotChanged]
      description: >-
        GMCP-80 §3.1. Field names match apps/console/lib/api/types.ts's ToolEntry
        (risk, policies) rather than the spec doc's illustrative riskLevel/policyIds.
      properties:
        name:
          type: string
        risk:
          $ref: "#/components/schemas/ToolRisk"
        policies:
          type: array
          items:
            type: string
        snapshotChanged:
          type: boolean
        snapshotDiff:
          oneOf:
            - $ref: "#/components/schemas/SnapshotDiff"
            - type: "null"
    ServerSummary:
      type: object
      required: [id, name, connected, trust, tools, endpoint]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connected:
          type: boolean
        trust:
          $ref: "#/components/schemas/TrustLevel"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolSummary"
        endpoint:
          type: string
    ServersResponse:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ServerSummary"
    McpServer:
      type: object
      required:
        - id
        - name
        - endpoint
        - trustLevel
        - connectionStatus
        - toolSnapshotHash
        - createdAt
        - updatedAt
        - trustLevelUpdatedAt
        - trustLevelUpdatedBy
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        endpoint:
          type: string
        trustLevel:
          $ref: "#/components/schemas/TrustLevel"
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        toolSnapshotHash:
          description: FR-GW-03 tool-snapshot hash; null until a first-approval snapshot exists.
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        trustLevelUpdatedAt:
          type: string
          format: date-time
        trustLevelUpdatedBy:
          description: 'null until a console identity system exists; "console" for a confirmed upgrade today.'
          type: [string, "null"]
    TrustChangeRequest:
      type: object
      required: [trustLevel]
      properties:
        trustLevel:
          $ref: "#/components/schemas/TrustLevel"
        confirmed:
          type: boolean
          default: false
    TrustLevelChangeEvent:
      type: object
      required: [eventId, ts, serverId, fromTrust, toTrust, direction, confirmedBy, prevHash, hash]
      properties:
        eventId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        serverId:
          type: string
          format: uuid
        fromTrust:
          $ref: "#/components/schemas/TrustLevel"
        toTrust:
          $ref: "#/components/schemas/TrustLevel"
        direction:
          type: string
          enum: [downgrade, upgrade]
        confirmedBy:
          description: Set for an upgrade; null for a downgrade (no confirmation is required).
          type: [string, "null"]
        prevHash:
          type: string
        hash:
          type: string
    SecurityEvent:
      type: object
      required: [id, sessionId, verdict, tool, at]
      description: >-
        apps/console/lib/api/types.ts's SecurityEvent — the SCR-101 widget's
        lean shape, not the full GuardEvent. mask_then_allow collapses into
        warn, matching Verdict's existing 4-value vocabulary.
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        tool:
          type: string
        target:
          description: No reliable source yet (only argsDigest is stored); always omitted.
          type: string
        at:
          type: string
          format: date-time
    RecentEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
    AttackScenarioSummary:
      type: object
      required: [id, title, description, available, modes]
      properties:
        id:
          type: string
          description: T-01..T-08
        title:
          type: string
        description:
          type: string
        available:
          type: boolean
          description: apps/console's AttackScenario.available — not runnable yet lists as 준비 중.
        modes:
          type: array
          items:
            type: string
            enum: [vulnerable, guarded]
    AttackScenariosResponse:
      type: object
      required: [scenarios]
      properties:
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/AttackScenarioSummary"
    RevealRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional; recorded in the audit log entry regardless.
    RevealResponse:
      type: object
      required: [eventId, originalPayload, revealedBy, revealedAt, auditLogId]
      properties:
        eventId:
          type: string
          format: uuid
        originalPayload:
          type: string
        revealedBy:
          type: string
        revealedAt:
          type: string
          format: date-time
        auditLogId:
          type: string
          format: uuid
    PolicyStatsResponse:
      type: object
      required: [policyId, window, firedLast30d]
      properties:
        policyId:
          type: string
        window:
          type: string
        firedLast30d:
          type: integer
        lastTriggeredAt:
          type: [string, "null"]
          format: date-time
    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum: [html, pdf]
          default: html
        theme:
          type: string
          enum: [light]
          default: light
