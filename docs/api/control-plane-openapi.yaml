openapi: 3.1.0
info:
  title: GuardMCP Control Plane Public API
  version: 1.0.0
  description: >-
    Public API v1 served by services/control-plane for the GuardMCP console.
    Most identifiers and demo data mirror the deterministic seeds in
    infra/postgres/001-demo-seed.sql and infra/redis/001-demo-seed.sh; the
    Replay-only fixtures used to exercise hash-chain and pagination behavior
    (see DemoSeed.SESSION_BROKEN_CHAIN_ID / SESSION_LARGE_ID) are in-memory
    only and intentionally absent from those seed files.
servers:
  - url: http://localhost:8080
    description: Local development (docker compose exposes the same port)
tags:
  - name: overview
  - name: sessions
  - name: policies
  - name: approvals
  - name: detect
  - name: attack-lab
  - name: servers
  - name: settings
  - name: events
  - name: benchmark
paths:
  /api/v1/overview:
    get:
      tags: [overview]
      summary: Protection status summary
      operationId: getOverview
      responses:
        "200":
          description: Current protection summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List sessions for the Replay left panel
      operationId: listSessions
      parameters:
        - name: q
          in: query
          required: false
          description: Session id or toolName substring match (case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [live, closed]
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Sessions ordered by startedAt descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sessions/{sessionId}/timeline:
    get:
      tags: [sessions]
      summary: Replay timeline for one session
      description: >-
        Returns the session's timeline nodes (USER_INPUT, AGENT_STEP, TOOL_CALL,
        VERDICT, RESULT) in ts-ascending order, eventId as the tie-break. Only
        VERDICT nodes carry `detail` (matched policies, detections, mask diff
        reference, hash chain). See docs/task-docs/GMCP-28/replay-api-spec.md.
      operationId: getSessionTimeline
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: event
          in: query
          required: false
          description: Anchors the response on this eventId (deep-link support)
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: ISO-8601 instant; only nodes strictly after this are returned
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
            maximum: 1000
      responses:
        "200":
          description: Ordered timeline nodes for the session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTimelineResponse"
        "400":
          description: The `event` query param does not name an eventId in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{sessionId}/export:
    post:
      tags: [sessions]
      summary: Session report export (GMCP-80 §3.7, M4 deliverable)
      description: >-
        Synchronous file-stream response (no async job endpoint yet — the
        spec's own sanctioned fallback while that scope is unconfirmed).
        Renders the session's timeline, verdict rationale and chain status
        straight from the same data GET /sessions/{id}/timeline serves, so
        the report can only ever carry masked text (NFR-04). Console
        exposure is deferred to M4; the API is available now.
      operationId: exportSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: The rendered report as an attachment
          content:
            text/html: {}
            application/pdf: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/recent:
    get:
      tags: [sessions]
      summary: Recent security events (GMCP-80 §3.3)
      description: >-
        Backs the SCR-101 "최근 보안 이벤트" widget and doubles as the SSE
        reconnect gap-fill (4.2 "복구 시 끊긴 구간은 폴링으로 보충").
        `since` accepts either an eventId (resume strictly after it) or an
        ISO-8601 instant (resume from that moment onward); results are
        newest-first. Backed by the real guard_event table (GMCP-24), not the
        Replay demo fixtures.
      operationId: listRecentEvents
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: An eventId (uuid) or an ISO-8601 instant
          schema:
            type: string
      responses:
        "200":
          description: Recent events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentEventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/events/{eventId}:
    get:
      tags: [sessions]
      summary: Single timeline node lookup (deep-link support)
      description: >-
        Same node schema as a timeline entry, with `sessionId` added, so a
        deep link (`/replay/{sessionId}?event={eventId}`) can paint the detail
        panel without loading the full timeline first.
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The timeline node, with its owning sessionId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventLookupResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/{eventId}/reveal:
    post:
      tags: [sessions]
      summary: Reveal the unmasked original payload (NFR-04, GMCP-84 §6.3)
      description: >-
        Requires the events:reveal permission (PermissionService): a
        privileged X-Actor-Role (operator/admin) *and* a valid
        X-Operator-Token (server-side secret, configured out of band via
        REVEAL_OPERATOR_TOKEN — unset by default, which disables this
        endpoint entirely). X-Actor-Role alone is a forgeable header with no
        session/auth system behind it anywhere in this service, so the token
        is the actual access control. Every call — granted or denied —
        writes a reveal_audit_log row (result: success /
        denied_no_permission / denied_not_stored). A syntactically invalid
        eventId 404s before the permission check (nothing to log against); a
        well-formed but unknown or not-yet-permitted eventId reaches the
        permission check first, matching the spec's step order. 409 when
        this event's raw payload was never stored (rawPayloadStorageEnabled
        was off at ingest time, or the key configured now cannot decrypt
        what's stored), not 404. Does not match
        apps/console/lib/api/types.ts's RevealContent (masked-line
        reconstruction is out of scope here); this is the spec's own
        response shape.
      operationId: revealEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Actor-Id
          in: header
          required: false
          schema:
            type: string
        - name: X-Actor-Role
          in: header
          required: false
          description: >-
            Must be "operator" or "admin", or the call is rejected with 403
            regardless of X-Operator-Token.
          schema:
            type: string
        - name: X-Operator-Token
          in: header
          required: true
          description: >-
            Must match the server's configured REVEAL_OPERATOR_TOKEN or the
            call is rejected with 403, regardless of X-Actor-Role.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
      responses:
        "200":
          description: Unmasked payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealResponse"
        "403":
          description: >-
            Missing the events:reveal permission — X-Operator-Token is
            missing/invalid/unconfigured server-side, or X-Actor-Role is not
            a privileged role. Either way the attempt is still logged
            (result: denied_no_permission).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No raw payload was stored for this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/policy-packs:
    get:
      tags: [policies]
      summary: List policy packs
      operationId: listPolicyPacks
      responses:
        "200":
          description: All policy packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyPack"
  /api/v1/policy-packs/{packId}:
    put:
      tags: [policies]
      summary: Toggle a policy pack (read-only — always rejected)
      description: >-
        fix-api.md §1: the Gateway is the only process that actually enforces
        policy packs (packages/policy-engine's loader), and there is no
        channel back from this store to the Gateway's own enable/disable
        state — toggling a pack here would change what the console displays
        without changing what the Gateway does. A known packId therefore
        always answers 409 policy_pack_toggle_read_only, never 200; an
        unknown packId is a 404. The console renders the switch disabled.
      operationId: updatePolicyPack
      parameters:
        - name: packId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The pack exists but is loaded by the gateway from policy-packs/ and cannot be toggled from the console
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/policies/sync:
    post:
      tags: [policies]
      summary: Gateway push — replaces the whole policy registry (fix-api.md §1)
      description: >-
        The only writer of the console's policy/pack state. The Gateway calls
        this once at boot and again after every hot-reload
        (packages/gateway/src/controlPlane/policySync.ts), reporting the
        pack/policy set it just loaded from policy-packs/ — there is no other
        way for GET /policies / GET /policy-packs to become non-empty.
        Publishes a policy.reloaded event on GET /events/stream. Requires a
        server-side shared secret (X-Sync-Token, configured out of band via
        POLICY_SYNC_TOKEN — unset by default, which disables this endpoint
        entirely): without it, any caller able to reach the Control Plane
        could overwrite the registry every console renders.
      operationId: syncPolicies
      parameters:
        - name: X-Sync-Token
          in: header
          required: true
          description: Must match the server's configured POLICY_SYNC_TOKEN or the call is rejected with 403.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySyncRequest"
      responses:
        "200":
          description: Counts of packs/policies stored, and when
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySyncResponse"
        "403":
          description: X-Sync-Token is missing, invalid, or unconfigured server-side (sync_unauthorized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/policies:
    get:
      tags: [policies]
      summary: List policies in priority order
      operationId: listPolicies
      responses:
        "200":
          description: All policies sorted by priority
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
  /api/v1/policies/{policyId}:
    put:
      tags: [policies]
      summary: Update a policy's action, severity, or priority
      operationId: updatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  $ref: "#/components/schemas/GuardAction"
                severity:
                  $ref: "#/components/schemas/Severity"
                priority:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated policy; the owning pack version is bumped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/policies/{policyId}/source:
    get:
      tags: [policies]
      summary: Raw policy YAML (fix-api.md §4)
      description: >-
        The source text synced in alongside the policy itself via POST
        /policies/sync — backs the Policy Chip popover and the SCR-302 YAML
        panel. 404 policy_not_found for an unknown policyId, or
        policy_source_not_found if the policy exists but no source has been
        synced for it yet.
      operationId: getPolicySource
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The policy's raw YAML and the file path it came from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/policies/{policyId}/stats:
    get:
      tags: [policies]
      summary: Policy trigger stats (GMCP-80 §3.5)
      description: >-
        A policy with no trigger history answers firedLast30d=0, not 404 —
        only an unknown policyId is a 404. dryRun=true always answers
        firedLast30d=0: no policy in this system is ever marked dry-run yet
        (GMCP-77 is unbuilt), so there is no dry-run subset of guard_event
        to count.
      operationId: getPolicyStats
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          description: 'Duration like "30d"'
          schema:
            type: string
            default: 30d
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Trigger count and last-triggered timestamp for the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals:
    get:
      tags: [approvals]
      summary: List approval cards
      operationId: listApprovals
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApprovalStatus"
      responses:
        "200":
          description: Approval cards ordered by request time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [approvals]
      summary: Register a tool call held for human approval
      description: >-
        Called by the gateway when a policy verdict is require_approval. The
        approval fails closed 120 seconds after registration if no decision
        arrives.
      operationId: createApproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalCreateRequest"
      responses:
        "201":
          description: Pending approval card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/approvals/{approvalId}/decision:
    post:
      tags: [approvals]
      summary: Resolve a pending approval
      operationId: decideApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  $ref: "#/components/schemas/ApprovalDecision"
                decidedBy:
                  type: string
      responses:
        "200":
          description: Approval with its terminal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The approval was already decided or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/detect/preview:
    post:
      tags: [detect]
      summary: Preview how the seeded policy pack judges a text
      description: >-
        Deterministic preview limited to the seeded policies
        (block_env_file_read, mask_korean_phone, approve_external_email).
        The full detector engine lives in packages/policy-engine; verdict
        aggregation here is fail-closed (strongest matched action wins).
        fix-api.md §3: the same wording can judge differently by direction
        (e.g. warn on request vs block on response) — direction rides as a
        query parameter, matching how the console already sends it
        (apps/console/lib/api/client.ts's previewDetection); the request
        body only ever carries text. Omitted/absent keeps the
        pre-existing direction-agnostic behavior.
      operationId: previewDetection
      parameters:
        - name: direction
          in: query
          required: false
          description: '"request" or "response"; any other value is a 400 invalid_direction.'
          schema:
            type: string
            enum: [request, response]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "200":
          description: Findings, aggregate verdict, and masked text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/attacklab/scenarios:
    get:
      tags: [attack-lab]
      summary: Attack Lab scenario catalog (GMCP-80 §3.4)
      description: >-
        Derived from attack-lab/scenarios/catalog.json (the same file the
        GMCP-55 runner executes against) at build time, not hand-maintained —
        a threat is available only once every one of its attack-kind
        scenarios has automation.mode=probe. Scoped to PROJECT.md 3.2's
        T-01..T-08; the catalog has since grown a T-09 this endpoint does
        not cover.
      operationId: listAttackLabScenarios
      responses:
        "200":
          description: All eight threats, available/modes reflecting real automation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackScenariosResponse"
  /api/v1/attacklab/run/{scenarioId}:
    post:
      tags: [attack-lab]
      summary: Queue an attack-lab scenario run
      description: >-
        Records the run request. Execution is owned by the Attack Lab runner
        (GMCP-55); this endpoint only validates the scenario and queues it.
      operationId: runAttackLabScenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            pattern: "^T-0[1-8]$"
      responses:
        "202":
          description: Queued run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttackLabRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/servers:
    get:
      tags: [servers]
      summary: List registered MCP servers (FR-GW-02)
      description: >-
        Lean summary shape shared by the console home-page inventory and the
        gateway's server-registry cache sync. See /api/v1/servers/{id} for the
        full entity (endpoint, connection/tool-snapshot state, trust-change
        provenance).
      operationId: listServers
      responses:
        "200":
          description: Registered servers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServersResponse"
  /api/v1/servers/{id}:
    get:
      tags: [servers]
      summary: Server detail
      operationId: getServer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full server entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServer"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/servers/{id}/trust:
    put:
      tags: [servers]
      summary: Change a server's trust grade
      description: >-
        Grade order is untrusted < limited < trusted. A downgrade applies
        immediately regardless of `confirmed`. An upgrade without
        `confirmed: true` is rejected with 409 and an impact summary instead
        of applying; the same request with `confirmed: true` then applies it.
        A request for the server's current grade is a no-op. Every actual
        change is recorded as a TrustLevelChangeEvent in the audit hash chain
        and pushed to /api/v1/servers/stream subscribers immediately. This is
        the endpoint GMCP-80 §3.8.1's `PUT /servers/{id}` describes — the
        console (lib/api/client.ts) deliberately calls this trust
        sub-resource rather than a bare PUT /servers/{id}, so no separate
        endpoint was added.
      operationId: changeServerTrust
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustChangeRequest"
      responses:
        "200":
          description: Updated (or unchanged, for a no-op) server summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The requested change is an upgrade and confirmed was not true.
            details carries fromTrust, toTrust, and affectedPolicyCount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/servers/trust-events:
    get:
      tags: [servers]
      summary: Trust-change audit chain
      description: Every TrustLevelChangeEvent recorded so far, in chain order (Replay Dashboard query surface).
      operationId: listTrustChangeEvents
      responses:
        "200":
          description: Chained trust-change events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustLevelChangeEvent"
  /api/v1/servers/stream:
    get:
      tags: [servers]
      summary: Server-registry push channel
      description: >-
        Server-sent events. Emits a servers.snapshot event with the current
        ServersResponse on connect, and again after every trust change — the
        gateway's registry cache and the console both subscribe instead of
        polling, so a downgrade reaches them without waiting out a poll
        interval.
      operationId: streamServers
      responses:
        "200":
          description: text/event-stream of servers.snapshot frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ServersResponse"
  /api/v1/settings:
    get:
      tags: [settings]
      summary: Current gateway settings (GMCP-68, GMCP-80 §3.8.2)
      operationId: getSettings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettings"
    put:
      tags: [settings]
      summary: Update gateway settings
      description: >-
        No console session/auth exists yet, so most of this is not gated on
        X-Actor-Role (apps/console/lib/api/client.ts sends none of the
        operator headers unless the update touches
        rawPayloadStorageEnabled) — for failMode/locale/approvalTimeoutSeconds
        X-Actor-Id is read only for the updatedBy audit trail. Every field is
        independent, so a caller sends only what it changed. Setting
        failMode to fail_open requires riskAcknowledged: true in the same
        request, regardless of the previous value — otherwise the request is
        rejected with 400 and nothing is changed. Reverting failMode to
        fail_closed never requires it. A failMode change is recorded as a
        SETTINGS_FAILURE_POLICY_CHANGED audit-log entry (severity=high for
        fail_open, info for fail_closed) and pushed to
        /api/v1/settings/stream subscribers immediately.
        rawPayloadStorageEnabled additionally requires the events:reveal /
        settings:write permission (X-Actor-Role + X-Operator-Token,
        PermissionService — GMCP-84 §7), and a false→true transition also
        requires acknowledgedNotice: true in the same request or the call is
        rejected with 422 (GMCP-84 §6.2). A true→false transition needs
        neither the checkbox nor a fresh notice, applies immediately, and
        the 200 response carries a note explaining that already-stored raw
        payloads are not deleted by this call. Turning it on is recorded as
        SETTINGS_RAW_PAYLOAD_OPT_IN_CHANGED (severity=high) and pushed over
        the same settings.changed stream the gateway's raw-payload cache
        subscribes to, so the change takes effect on the very next ingest
        without a gateway restart.
      operationId: updateSettings
      parameters:
        - name: X-Actor-Id
          in: header
          required: false
          description: Recorded as updatedBy on the settings row; not an access-control check.
          schema:
            type: string
        - name: X-Actor-Role
          in: header
          required: false
          description: >-
            Only checked when the request body sets rawPayloadStorageEnabled;
            must be "operator" or "admin" or the call is rejected with 403.
          schema:
            type: string
        - name: X-Operator-Token
          in: header
          required: false
          description: >-
            Only required when the request body sets rawPayloadStorageEnabled
            (GMCP-84 §7); must match the server's configured
            REVEAL_OPERATOR_TOKEN or the call is rejected with 403.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardSettings"
        "400":
          description: >-
            Malformed failMode, an out-of-range approvalTimeoutSeconds or
            unsupported locale, or failMode=fail_open without
            riskAcknowledged=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: >-
            The request sets rawPayloadStorageEnabled but lacks the
            events:reveal / settings:write permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            rawPayloadStorageEnabled is being turned on (false→true) without
            acknowledgedNotice: true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/settings/stream:
    get:
      tags: [settings]
      summary: Settings push channel
      description: >-
        Server-sent events. Emits a settings.changed event with the current
        failMode, rawPayloadStorageEnabled and version on connect, and again
        after every write — the gateway's failure-policy cache and its
        raw-payload-storage cache (GMCP-84 §9) both subscribe to this one
        stream instead of polling, matching /api/v1/servers/stream's
        contract.
      operationId: streamSettings
      responses:
        "200":
          description: text/event-stream of settings.changed frames
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  failMode:
                    $ref: "#/components/schemas/FailMode"
                  rawPayloadStorageEnabled:
                    type: boolean
                  version:
                    type: integer
                    format: int64
  /api/v1/events/stream:
    get:
      tags: [events]
      summary: Combined guard/approval/policy push channel (fix-api.md §5)
      description: >-
        Server-sent events. One connection carries every event type the
        console subscribes to (apps/console/lib/sse.ts's
        GUARD_EVENT_TYPES): guard.event (a new GuardEvent ingested),
        approval.created and approval.resolved (ApprovalStore), and
        policy.reloaded (a PolicySyncResponse — fires on POST
        /policies/sync, including the boot sync, not only a hot-reload).
        Unlike /api/v1/servers/stream or /api/v1/settings/stream, there is
        no resendable snapshot pushed on connect — every frame here is a
        live occurrence a client connecting late has already missed.
      operationId: streamEvents
      responses:
        "200":
          description: text/event-stream of guard.event / approval.created / approval.resolved / policy.reloaded frames
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SecurityEvent"
                  - $ref: "#/components/schemas/Approval"
                  - $ref: "#/components/schemas/PolicySyncResponse"
  /api/v1/benchmark/report:
    get:
      tags: [benchmark]
      summary: Latest detection-benchmark report (fix-api.md §7, SCR-601)
      description: >-
        Serves attack-lab/benchmark/run.ts's report output
        (GUARDMCP_BENCHMARK_REPORT, default reports/benchmark.json) verbatim
        — this service does not compute or validate it, only reads and
        passes through whatever bytes are on disk. Shape matches
        apps/console/lib/api/types.ts's BenchmarkReport; fields that type
        doesn't model (e.g. dryRunObservations, koreanInjection) still pass
        through and are ignored on that side.
      operationId: getBenchmarkReport
      responses:
        "200":
          description: The report JSON, byte-for-byte
          content:
            application/json:
              schema:
                type: object
                description: See apps/console/lib/api/types.ts's BenchmarkReport for the modeled subset.
        "404":
          description: No report file on disk yet (benchmark_report_not_found) — run `npm run bench` or mount one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/benchmark/samples:
    get:
      tags: [benchmark]
      summary: Per-sample detection verdicts backing the benchmark report (fix-api.md §7, SCR-601)
      description: >-
        Serves attack-lab/benchmark/run.ts's samples output
        (GUARDMCP_BENCHMARK_SAMPLES, default reports/benchmark-samples.json)
        verbatim, same passthrough contract as GET /benchmark/report. Row
        detected reflects the same detect() call runBenchmark() itself
        scores recall/fpr against — including for a labelled-negative
        sample, so a sample the report's fpr counts as a false positive
        shows detected=true here too, not a fixed false.
      operationId: getBenchmarkSamples
      responses:
        "200":
          description: The samples JSON, byte-for-byte
          content:
            application/json:
              schema:
                type: object
                description: See apps/console/lib/api/types.ts's BenchmarkSamplesResponse for the modeled subset.
        "404":
          description: No samples file on disk yet (benchmark_samples_not_found) — run `npm run bench` or mount one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  responses:
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The referenced resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    GuardAction:
      type: string
      enum: [allow, mask_then_allow, require_approval, block]
    Severity:
      type: string
      enum: [low, medium, high, critical]
    ApprovalStatus:
      type: string
      enum: [pending, approved, approved_masked, blocked, expired]
    ApprovalDecision:
      type: string
      enum: [block, approve_masked, approve]
    FailMode:
      type: string
      description: >-
        What the gateway does when its own inspection pipeline errors or
        times out (NFR-03, GMCP-68). fail_closed is the shipped default.
      enum: [fail_closed, fail_open]
    GuardSettings:
      type: object
      required: [failMode, riskAcknowledged, rawPayloadStorageEnabled, locale, approvalTimeoutSeconds]
      properties:
        failMode:
          $ref: "#/components/schemas/FailMode"
        riskAcknowledged:
          type: boolean
          description: >-
            Whether the operator ticked the risk-acknowledgement checkbox the
            last time failMode became fail_open.
        rawPayloadStorageEnabled:
          type: boolean
          description: >-
            NFR-04/GMCP-84 §5.1. Off by default; gates whether ingest writes
            a raw_payload row (AES-256-GCM encrypted) and sets
            guard_event.raw_payload_ref.
        rawPayloadStorageEnabledAt:
          type: string
          format: date-time
          nullable: true
          description: Last time it was turned on (false→true); null until the first time.
        rawPayloadStorageEnabledBy:
          type: string
          nullable: true
        locale:
          type: string
          enum: [ko, en]
        approvalTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        note:
          type: string
          description: >-
            PUT response only: present when rawPayloadStorageEnabled just
            went true→false, explaining that existing stored payloads are
            not deleted by this call. Never present on GET.
    SettingsUpdateRequest:
      type: object
      description: Partial<GatewaySettings> — every field independent, unset fields are left unchanged.
      properties:
        failMode:
          $ref: "#/components/schemas/FailMode"
        riskAcknowledged:
          type: boolean
        rawPayloadStorageEnabled:
          type: boolean
        acknowledgedNotice:
          type: boolean
          description: >-
            Must be true when rawPayloadStorageEnabled is being turned on
            (false→true) — GMCP-84 §6.2. Ignored otherwise.
        locale:
          type: string
          enum: [ko, en]
        approvalTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable reason code
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
    Overview:
      type: object
      required:
        - protected
        - gatewayCount
        - activePolicyPacks
        - blockedToday
        - maskedToday
        - pendingApprovals
        - generatedAt
      properties:
        protected:
          type: boolean
        gatewayCount:
          type: integer
        activePolicyPacks:
          type: array
          items:
            type: string
        blockedToday:
          type: integer
        maskedToday:
          type: integer
        pendingApprovals:
          type: integer
        generatedAt:
          type: string
          format: date-time
    Verdict:
      type: string
      description: >-
        Replay/console display vocabulary (PROJECT.md 5.3, SCREEN-SPACE.md 4.3).
        Distinct from GuardAction: mask_then_allow there corresponds to warn
        here, so this API never emits "mask" despite an editorial slip in the
        original replay-api-spec.md task doc.
      enum: [allow, warn, require_approval, block]
    TimelineNodeType:
      type: string
      enum: [USER_INPUT, AGENT_STEP, TOOL_CALL, VERDICT, RESULT]
    ToolCallDirection:
      type: string
      enum: [req, res]
    ChainStatus:
      type: string
      enum: [valid, broken]
    Span:
      type: object
      required: [start, end]
      properties:
        start:
          type: integer
        end:
          type: integer
    Detection:
      type: object
      required: [type, subtype, span, confidence, maskedAs]
      properties:
        type:
          type: string
          description: PII | SECRET | INJ
        subtype:
          type: string
        span:
          $ref: "#/components/schemas/Span"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        maskedAs:
          type: string
          description: Always the masked form; the raw match is never returned by this API.
    VerdictDetail:
      type: object
      required: [matchedPolicyIds, detections, maskDiffRef, hash, prevHash]
      properties:
        matchedPolicyIds:
          type: array
          items:
            type: string
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
        maskDiffRef:
          type: string
          description: URL the Mask Diff View fetches separately (GET /events/{id}/mask-diff, out of scope)
        hash:
          type: string
        prevHash:
          type: string
          description: Empty string for the first VERDICT node in a session (chain genesis)
    TimelineNode:
      type: object
      required: [eventId, type, ts, summary, detail]
      description: >-
        `detail` is populated only for type=VERDICT; every other node type
        returns it as an explicit null. toolName/direction/argsDigest are only
        present on TOOL_CALL nodes; verdict/riskScore only on VERDICT nodes.
      properties:
        eventId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/TimelineNodeType"
        ts:
          type: string
          format: date-time
        summary:
          type: string
        toolName:
          type: string
        direction:
          $ref: "#/components/schemas/ToolCallDirection"
        argsDigest:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        detail:
          oneOf:
            - $ref: "#/components/schemas/VerdictDetail"
            - type: "null"
        hasRawPayload:
          type: boolean
          description: >-
            GMCP-84 §8.3. Whether this event has a stored, revealable raw
            payload — true only for a VERDICT node whose guard_event row has
            a non-null raw_payload_ref. Absent/false everywhere else.
    SessionSummary:
      type: object
      required: [sessionId, agentLabel, startedAt, endedAt, isLive, eventCount, verdictSummary]
      properties:
        sessionId:
          type: string
          format: uuid
        agentLabel:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, "null"]
          format: date-time
        isLive:
          type: boolean
        eventCount:
          type: integer
        verdictSummary:
          type: object
          description: Fixed keys allow/warn/require_approval/block, always all four.
          additionalProperties:
            type: integer
    SessionsResponse:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        nextCursor:
          type: [string, "null"]
        total:
          type: integer
          description: Count matching q/status — not items.length, the page size (GMCP-80 §3.2).
    SessionTimelineResponse:
      type: object
      required: [sessionId, agentLabel, startedAt, isLive, chainStatus, nodes, nextCursor]
      properties:
        sessionId:
          type: string
          format: uuid
        agentLabel:
          type: string
        startedAt:
          type: string
          format: date-time
        isLive:
          type: boolean
        chainStatus:
          $ref: "#/components/schemas/ChainStatus"
        brokenAt:
          type: string
          format: uuid
          description: First eventId whose hash chain check failed; present only when chainStatus=broken
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TimelineNode"
        nextCursor:
          type: [string, "null"]
    EventLookupResponse:
      allOf:
        - type: object
          required: [sessionId]
          properties:
            sessionId:
              type: string
              format: uuid
        - $ref: "#/components/schemas/TimelineNode"
    PolicyPack:
      type: object
      required: [id, version, enabled, description, updatedAt]
      properties:
        id:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        description:
          type: string
        updatedAt:
          type: string
          format: date-time
    Policy:
      type: object
      required: [id, packId, priority, action, severity, description]
      properties:
        id:
          type: string
        packId:
          type: string
        priority:
          type: integer
        action:
          $ref: "#/components/schemas/GuardAction"
        severity:
          $ref: "#/components/schemas/Severity"
        description:
          type: string
    PolicyDetailResponse:
      type: object
      description: fix-api.md §4 — the Policy Chip popover / SCR-302 YAML panel.
      required: [id, yaml, path]
      properties:
        id:
          type: string
        yaml:
          type: string
        path:
          type: string
    PolicySyncPackInput:
      type: object
      description: The Gateway's own PackState shape (fix-api.md §1).
      required: [packId, name]
      properties:
        packId:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
    PolicySyncPolicyInput:
      type: object
      required: [id, packId, priority, action, severity]
      properties:
        id:
          type: string
        packId:
          type: string
        priority:
          type: integer
        action:
          type: string
          description: The Gateway's own Action wire value — not validated against GuardAction's enum here.
        severity:
          type: string
          description: The Gateway's own Severity wire value — not validated against Severity's enum here.
        description:
          type: string
        direction:
          type: string
          description: '"request", "response", or "any" (the pipeline default) when omitted.'
        message:
          type: string
          description: Accepted for wire-shape parity with the Gateway's PackState.policies; not yet surfaced by any console field.
        enabled:
          type: boolean
          default: true
        sourcePath:
          type: string
        sourceYaml:
          type: string
    PolicySyncRequest:
      type: object
      properties:
        packs:
          type: array
          items:
            $ref: "#/components/schemas/PolicySyncPackInput"
          default: []
        policies:
          type: array
          items:
            $ref: "#/components/schemas/PolicySyncPolicyInput"
          default: []
    PolicySyncResponse:
      type: object
      required: [packsStored, policiesStored, syncedAt]
      properties:
        packsStored:
          type: integer
        policiesStored:
          type: integer
        syncedAt:
          type: string
          format: date-time
    ApprovalCreateRequest:
      type: object
      required: [sessionId, toolName, riskReason]
      properties:
        sessionId:
          type: string
          format: uuid
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string
        riskReason:
          type: string
        policyId:
          type: [string, "null"]
    Approval:
      type: object
      required: [id, sessionId, status, toolName, arguments, riskReason, requestedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        toolName:
          type: string
        arguments:
          type: object
          additionalProperties:
            type: string
        riskReason:
          type: string
        policyId:
          type: [string, "null"]
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - $ref: "#/components/schemas/ApprovalDecision"
            - type: "null"
        decidedBy:
          type: [string, "null"]
        decidedAt:
          type: [string, "null"]
          format: date-time
    DetectionFinding:
      type: object
      required: [policyId, action, severity, matchedText, start, end]
      properties:
        policyId:
          type: string
        action:
          $ref: "#/components/schemas/GuardAction"
        severity:
          $ref: "#/components/schemas/Severity"
        matchedText:
          type: string
        start:
          type: integer
        end:
          type: integer
    DetectionPreview:
      type: object
      required: [verdict, findings, maskedText]
      properties:
        verdict:
          $ref: "#/components/schemas/GuardAction"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DetectionFinding"
        maskedText:
          type: string
    AttackLabRun:
      type: object
      required: [runId, scenarioId, status, requestedAt]
      properties:
        runId:
          type: string
          format: uuid
        scenarioId:
          type: string
        status:
          type: string
          enum: [queued]
        requestedAt:
          type: string
          format: date-time
    TrustLevel:
      type: string
      enum: [trusted, limited, untrusted]
    ConnectionStatus:
      type: string
      enum: [connected, disconnected]
    ToolRisk:
      type: string
      enum: [high, medium, low]
    ToolSnapshotStatusView:
      type: object
      required: [state, pendingDiffCount]
      description: >-
        FR-GW-03 §6.1. Postgres-backed drift state, unlike ToolSummary's risk/policies which
        are still a static demo seed (see ToolSummary's own description).
      properties:
        state:
          type: string
          enum: [unapproved, in_sync, drift_detected, drift_acknowledged]
        snapshotCapturedAt:
          type: [string, "null"]
          format: date-time
        lastCheckedAt:
          type: [string, "null"]
          format: date-time
        pendingDiffCount:
          type: integer
        latestDiffId:
          type: [string, "null"]
          format: uuid
    ToolSummary:
      type: object
      required: [name, risk, policies, snapshotStatus]
      description: >-
        GMCP-80 §3.1. Field names match apps/console/lib/api/types.ts's ToolEntry
        (risk, policies) rather than the spec doc's illustrative riskLevel/policyIds.
        risk/policies are a fixed demo seed (no real per-tool risk scoring or
        policy binding exists yet); snapshotStatus is FR-GW-03's real, Postgres-backed
        drift state.
      properties:
        name:
          type: string
        risk:
          $ref: "#/components/schemas/ToolRisk"
        policies:
          type: array
          items:
            type: string
        snapshotStatus:
          $ref: "#/components/schemas/ToolSnapshotStatusView"
    ServerSummary:
      type: object
      required: [id, name, connected, trust, tools, endpoint]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connected:
          type: boolean
        trust:
          $ref: "#/components/schemas/TrustLevel"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolSummary"
        endpoint:
          type: string
    ServersResponse:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/ServerSummary"
    McpServer:
      type: object
      required:
        - id
        - name
        - endpoint
        - trustLevel
        - connectionStatus
        - toolSnapshotHash
        - createdAt
        - updatedAt
        - trustLevelUpdatedAt
        - trustLevelUpdatedBy
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        endpoint:
          type: string
        trustLevel:
          $ref: "#/components/schemas/TrustLevel"
        connectionStatus:
          $ref: "#/components/schemas/ConnectionStatus"
        toolSnapshotHash:
          description: FR-GW-03 tool-snapshot hash; null until a first-approval snapshot exists.
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        trustLevelUpdatedAt:
          type: string
          format: date-time
        trustLevelUpdatedBy:
          description: 'null until a console identity system exists; "console" for a confirmed upgrade today.'
          type: [string, "null"]
    TrustChangeRequest:
      type: object
      required: [trustLevel]
      properties:
        trustLevel:
          $ref: "#/components/schemas/TrustLevel"
        confirmed:
          type: boolean
          default: false
    TrustLevelChangeEvent:
      type: object
      required: [eventId, ts, serverId, fromTrust, toTrust, direction, confirmedBy, prevHash, hash]
      properties:
        eventId:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        serverId:
          type: string
          format: uuid
        fromTrust:
          $ref: "#/components/schemas/TrustLevel"
        toTrust:
          $ref: "#/components/schemas/TrustLevel"
        direction:
          type: string
          enum: [downgrade, upgrade]
        confirmedBy:
          description: Set for an upgrade; null for a downgrade (no confirmation is required).
          type: [string, "null"]
        prevHash:
          type: string
        hash:
          type: string
    SecurityEvent:
      type: object
      required: [id, sessionId, verdict, tool, at]
      description: >-
        apps/console/lib/api/types.ts's SecurityEvent — the SCR-101 widget's
        lean shape, not the full GuardEvent. mask_then_allow collapses into
        warn, matching Verdict's existing 4-value vocabulary.
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        tool:
          type: string
        target:
          description: No reliable source yet (only argsDigest is stored); always omitted.
          type: string
        at:
          type: string
          format: date-time
    RecentEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
    AttackScenarioSummary:
      type: object
      required: [id, title, description, available, modes]
      properties:
        id:
          type: string
          description: T-01..T-08
        title:
          type: string
        description:
          type: string
        available:
          type: boolean
