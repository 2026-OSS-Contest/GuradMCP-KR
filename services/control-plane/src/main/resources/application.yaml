spring:
  application:
    name: guardmcp-control-plane
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # Redis backs the approval queue only under the compose profile; keep the
      # default profile's aggregate health independent of an unused dependency.
      enabled: false
