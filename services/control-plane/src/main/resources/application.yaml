spring:
  application:
    name: guardmcp-control-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guardmcp}
    username: ${SPRING_DATASOURCE_USERNAME:guardmcp}
    password: ${SPRING_DATASOURCE_PASSWORD:guardmcp-local-only}
  flyway:
    enabled: true
    # infra/postgres/001-demo-seed.sql (docker-compose) creates demo tables in the public
    # schema before Flyway ever runs, so a fresh compose stack always looks like a
    # populated-but-untracked schema to Flyway. Baseline it at version 0 so V1__create_guard_event
    # applies on top instead of aborting with "found non-empty schema, no history table".
    baseline-on-migrate: true
    baseline-version: 0
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

security:
  # NFR-04/GMCP-84 §7: shared secret required (in addition to a privileged X-Actor-Role) for both
  # `events:reveal` and `settings:write` (PermissionService). Blank (the default) disables both
  # entirely — deploying without setting this must not silently leave either reachable by header
  # alone.
  reveal-token: ${REVEAL_OPERATOR_TOKEN:}
  # GMCP-84 §5.2/§2: AES-256-GCM key for raw_payload.payload_encrypted, base64-encoded (32 raw
  # bytes). Blank (the default) makes raw-payload storage a no-op regardless of
  # rawPayloadStorageEnabled -- KMS-managed rotation is explicitly out of scope; this is a single
  # env-provided secret only.
  raw-payload-encryption-key: ${RAW_PAYLOAD_ENCRYPTION_KEY:}
  raw-payload-encryption-key-version: ${RAW_PAYLOAD_ENCRYPTION_KEY_VERSION:v1}
