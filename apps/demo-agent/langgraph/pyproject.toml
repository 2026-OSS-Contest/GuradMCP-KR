[project]
name = "guardmcp-langgraph-demo"
version = "0.1.0"
description = "LangGraph demo agent for GuardMCP-KR (GMCP-95)"
requires-python = ">=3.9"
dependencies = ["langgraph>=0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardmcp_langgraph*"]
