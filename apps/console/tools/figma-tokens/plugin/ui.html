<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Figma injects --figma-color-* into the plugin iframe and swaps them with the editor
         theme. Hard-coding colours here (white buttons, light code block) leaves invisible
         labels in dark mode, because the inherited text colour is light too. */
      :root {
        color-scheme: light dark;
        font: 12px/1.5 ui-sans-serif, system-ui, sans-serif;
        --bg: var(--figma-color-bg, #fff);
        --bg-alt: var(--figma-color-bg-secondary, #f5f5f5);
        --fg: var(--figma-color-text, #111);
        --fg-dim: var(--figma-color-text-secondary, #666);
        --line: var(--figma-color-border, #ccc);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --on-brand: var(--figma-color-text-onbrand, #fff);
      }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); }
      h1 { font-size: 13px; margin: 0 0 8px; }
      #summary { margin: 0 0 12px; color: var(--fg-dim); }
      .row { display: flex; gap: 8px; }
      button {
        font: inherit; padding: 8px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: transparent; color: var(--fg);
      }
      button:hover:not(:disabled) { background: var(--bg-alt); }
      button#sync { background: var(--brand); color: var(--on-brand); border-color: var(--brand); font-weight: 600; }
      button:disabled { opacity: .5; cursor: default; }
      pre {
        margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; min-height: 40px;
        background: var(--bg-alt); color: var(--fg); padding: 8px; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>GuardMCP Token Sync</h1>
    <p id="summary">Variables 읽는 중…</p>
    <div class="row">
      <button id="sync" disabled>Sync tokens → repo</button>
      <button id="close">닫기</button>
    </div>
    <pre id="status"></pre>
    <script>
      const BRIDGE = "http://localhost:3999/tokens";
      let tokens = null;
      const $ = (id) => document.getElementById(id);

      onmessage = (e) => {
        const msg = e.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "tokens") {
          tokens = msg.payload;
          const vars = tokens.collections.reduce((n, c) => n + c.variables.length, 0);
          const s = tokens.styles || { text: [], paint: [], effect: [] };
          $("summary").textContent =
            `${tokens.fileName} — 변수 ${vars} · 텍스트 ${s.text.length} · 이펙트 ${s.effect.length}`;
          $("sync").disabled = false;
        } else if (msg.type === "empty") {
          $("summary").textContent = "이 파일에 로컬 Variables가 없습니다.";
        } else if (msg.type === "error") {
          $("summary").textContent = "오류: " + msg.message;
        }
      };

      $("sync").onclick = async () => {
        $("status").textContent = "전송 중…";
        try {
          const res = await fetch(BRIDGE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(tokens)
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || res.statusText);
          $("status").textContent = `완료 ✓  변수 ${data.variables}개 → ${data.path}`;
        } catch (err) {
          $("status").textContent =
            "실패: " + (err.message || err) + "\n브릿지 서버가 켜져 있나요?  npm run figma:bridge";
        }
      };

      $("close").onclick = () => parent.postMessage({ pluginMessage: { type: "close" } }, "*");
    </script>
  </body>
</html>
