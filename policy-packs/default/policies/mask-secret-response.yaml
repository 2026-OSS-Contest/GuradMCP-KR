# Credentials arriving in a tool response, masked before the Agent reads them.
#
# The response direction had a rule for injection (block) and one for personal
# data (mask), and none for secrets — so a token or key in a tool response fell
# through to the pack default and reached the Agent verbatim. The Attack Lab
# runner reports A-04, A-05, and A-16..A-19 against this gap (GMCP-113).
id: mask_secret_response
pack: default
version: 1
description: Mask credentials detected in MCP tool responses
# Below the approval policy (200), beside the Korean-PII masking rule: a masking
# verdict should never outrank one that stops or gates the call.
priority: 310
match:
  direction: response
  tool: '*' # Any tool can return a credential; the leak is in the payload, not the caller.
  server_trust: any # A trusted server that echoes a key has still echoed a key.
  detections:
    # Parent tag SECRET covers LLM_API_KEY, GITHUB_TOKEN, AWS_KEY, JWT,
    # PRIVATE_KEY, the webhook URLs, and the Korean service credentials.
    any_of: [SECRET]
action: mask_then_allow
severity: high
message: Credential spans were masked before the tool response was delivered.
