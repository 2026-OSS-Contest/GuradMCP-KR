version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: deps

  - package-ecosystem: gradle
    directory: /services/control-plane
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    groups:
      kotlin-and-spring:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.springframework*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
