name: policy-tests

on:
  pull_request:
    paths:
      - "policy-packs/**"
      - "packages/policy-engine/**"

permissions:
  contents: read

concurrency:
  group: policy-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"

jobs:
  policy-table-tests:
    name: policy / policy-table-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run policy table tests and coverage gate
        run: npm run test:policy --workspace @guardmcp/policy-engine
